[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veritaskit"
version = "1.1.0"
description = "VERITAS: a formally verified, competence-aware interpretable guardrail for LLMs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anwar Debes" }]
keywords = ["tsetlin-machine", "formal-verification", "ai-safety", "guardrail",
            "interpretable-ml", "sat", "smt", "selective-prediction", "llm", "assurance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = ["numpy>=1.21", "z3-solver>=4.12", "python-sat>=0.1.8"]

[project.optional-dependencies]
experiments = ["scikit-learn>=1.0", "scipy>=1.7", "matplotlib>=3.4"]
data = ["datasets>=2.0", "pandas>=1.3"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/AnwarDebes/VERITAS"
Paper = "https://github.com/AnwarDebes/VERITAS/blob/main/paper/veritas.pdf"

[tool.setuptools]
packages = ["veritaskit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
